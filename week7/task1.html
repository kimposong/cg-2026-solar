<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>7주차 실습 1 · 기본 ray tracing 으로 일식·월식 보기</title>
<link rel="stylesheet" href="demo.css">
<style>
.wrap{grid-template-columns:minmax(0,1fr) 17rem;height:100vh;height:100dvh}
.stage{min-height:340px}.stage canvas{width:100%;height:100%;max-width:none;max-height:none;touch-action:none}
.orbit-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}.orbit-actions button{flex:1 1 7rem}
@media(max-width:800px){.wrap{display:block;height:auto}.stage{height:68vh;min-height:340px}.panel{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="cv" aria-label="학생이 TODO를 채워 완성하는 기본 ray tracing 시작 코드"></canvas></div>
  <aside class="panel">
    <h1>기본 ray tracing 실습 1 · 일식과 월식</h1>
    <p class="sub">프래그먼트 셰이더가 픽셀마다 카메라 광선 → 구 교차 → 그림자 광선 순서로 장면을 조회합니다. 위성 공전 위치를 바꾸면 일식(0°)과 월식(180°)을 모두 볼 수 있습니다. 드래그: 카메라 회전 · 휠: 확대</p>
    <div id="ui"></div>
    <div class="orbit-actions"><button id="solar" type="button">일식 보기</button><button id="lunar" type="button">월식 보기</button><button id="play" type="button">공전 재생</button></div>
    <button id="reset" type="button">시점 초기화</button>
    <p class="note">「그림자 광선」을 끄면 가림 검사를 하지 않아 일식 그림자와 월식의 어두운 위성이 사라집니다. 같은 시점에서 끄고 켜며 비교해 보세요.</p>
    <p id="status" role="status"></p>
  </aside>
</div>
<script src="demo.js"></script>
<script src="task1.js"></script>
</body>
</html>
